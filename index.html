.progress {

#question {

}

    background: #1c5735;

.answer:hover {

.answer:disabled {

.correct {

.wrong {

#message {

.next,

/* ==================================================
   ZMIENNE GRY
================================================== */

let category = "";
let questions = [];
let current = 0;
let score = 0;
let coins = 0;
let lives = 3;
let combo = 0;
let time = 15;
let timer = null;
let answered = false;
let hintUsed = false;
let fiftyUsed = false;


/* ==================================================
   WYBÓR TRUDNOŚCI
================================================== */

function chooseDifficulty(type) {

category = type;

document.getElementById("menu")
.classList.add("hidden");

document.getElementById("difficulty")
.classList.remove("hidden");

let names = {
classic:"⚽ Klasyczny Quiz",
players:"👤 Zgadnij Piłkarza",
clubs:"🏟️ Kluby i Stadiony",
countries:"🌍 Reprezentacje"
};

document.getElementById("difficultyTitle")
.innerText = names[type];

}


/* ==================================================
   START
================================================== */

function startGame(level) {

if(level === "easy") {
questions = easy[category].slice();
time = 15;
}

if(level === "medium") {
questions = medium[category].slice();
time = 12;
}

if(level === "hard") {
questions = hard[category].slice();
time = 8;
}

current = 0;
score = 0;
coins = 0;
lives = 3;
combo = 0;

document.getElementById("difficulty")
.classList.add("hidden");

document.getElementById("game")
.classList.remove("hidden");

showQuestion();

}


/* ==================================================
   ZDJĘCIE PIŁKARZA
================================================== */

async function loadPlayerImage(name) {

const picture =
document.getElementById("picture");

picture.innerHTML =
"<p class='small'>📸 Ładowanie zdjęcia...</p>";

try {

let url =
"https://pl.wikipedia.org/api/rest_v1/page/summary/"
+ encodeURIComponent(name);

let response =
await fetch(url);

let data =
await response.json();

if(data.thumbnail && data.thumbnail.source) {

picture.innerHTML = "";

let img =
document.createElement("img");

img.src =
data.thumbnail.source;

img.className =
"player-image";

picture.appendChild(img);

}
else {

picture.innerHTML =
"<p class='small'>📸 Zdjęcie niedostępne</p>";

}

}
catch(error) {

picture.innerHTML =
"<p class='small'>📸 Nie udało się pobrać zdjęcia</p>";

}

}


/* ==================================================
   PYTANIE
================================================== */

function showQuestion() {

clearInterval(timer);

answered = false;
hintUsed = false;
fiftyUsed = false;

document.getElementById("message").innerText = "";

document.getElementById("hint")
.classList.add("hidden");

document.getElementById("next")
.classList.add("hidden");

document.getElementById("picture").innerHTML = "";

const q = questions[current];

document.getElementById("question")
.innerText = q.q;


/* ZDJĘCIE */

if(category === "players") {

loadPlayerImage(q.name);

}


/* ODPOWIEDZI */

const box =
document.getElementById("answers");

box.innerHTML = "";

let list = q.a.slice();

list.sort(() => Math.random() - 0.5);

list.forEach(function(answer) {

let button =
document.createElement("button");

button.className = "answer";

button.innerText = answer;

button.onclick = function() {

checkAnswer(button, answer);

};

box.appendChild(button);

});


/* POSTĘP */

document.getElementById("progress")
.style.width =
((current / questions.length) * 100) + "%";


/* TIMER */

let maxTime = 15;

if(time === 12) maxTime = 12;

if(time === 8) maxTime = 8;

let remaining = maxTime;

document.getElementById("timer")
.innerText =
"⏱️ " + remaining;

timer = setInterval(function() {

remaining--;

document.getElementById("timer")
.innerText =
"⏱️ " + remaining;

if(remaining <= 0) {

clearInterval(timer);

timeOut();

}

},1000);

updateStats();

}


/* ==================================================
   ODPOWIEDŹ
================================================== */

function checkAnswer(button, answer) {

if(answered) return;

answered = true;

clearInterval(timer);

const correct =
questions[current].c;

document.querySelectorAll(".answer")
.forEach(function(btn) {

btn.disabled = true;

if(btn.innerText === correct) {
btn.classList.add("correct");
}

});


if(answer === correct) {

button.classList.add("correct");

combo++;

let points = 1;

if(category === "players") {
points = 2;
}

if(combo >= 3) {
points++;
}

if(combo >= 5) {
points++;
}

score += points;

coins += points;

document.getElementById("message")
.innerText =
"✅ DOBRZE! +" + points + " pkt";

}
else {

button.classList.add("wrong");

lives--;

combo = 0;

document.getElementById("message")
.innerText =
"❌ ŹLE! Poprawna odpowiedź: "
+ correct;

}

updateStats();

if(lives <= 0) {

setTimeout(endGame,800);

return;

}

document.getElementById("next")
.classList.remove("hidden");

}


/* ==================================================
   CZAS
================================================== */

function timeOut() {

if(answered) return;

answered = true;

lives--;

combo = 0;

const correct =
questions[current].c;

document.querySelectorAll(".answer")
.forEach(function(btn) {

btn.disabled = true;

if(btn.innerText === correct) {
btn.classList.add("correct");
}

});

document.getElementById("message")
.innerText =
"⏰ CZAS! Poprawna odpowiedź: "
+ correct;

updateStats();

if(lives <= 0) {

setTimeout(endGame,800);

return;

}

document.getElementById("next")
.classList.remove("hidden");

}


/* ==================================================
   NASTĘPNE
================================================== */

function nextQuestion() {

current++;

if(current >= questions.length) {

endGame();

}
else {

showQuestion();

}

}


/* ==================================================
   50/50
================================================== */

function fiftyFifty() {

if(fiftyUsed || answered) return;

if(coins < 3) {

document.getElementById("message")
.innerText =
"🪙 Potrzebujesz 3 monet!";

return;

}

coins -= 3;

fiftyUsed = true;

const correct =
questions[current].c;

let wrong = [];

document.querySelectorAll(".answer")
.forEach(function(btn) {

if(btn.innerText !== correct) {
wrong.push(btn);
}

});

wrong.sort(() => Math.random() - 0.5);

wrong.slice(0,2)
.forEach(function(btn) {

btn.style.visibility = "hidden";

});

updateStats();

}


/* ==================================================
   PODPOWIEDŹ
================================================== */

function showHint() {

if(hintUsed || answered) return;

if(coins < 2) {

document.getElementById("message")
.innerText =
"🪙 Potrzebujesz 2 monet!";

return;

}

coins -= 2;

hintUsed = true;

document.getElementById("hint")
.innerText =
"💡 " + questions[current].h;

document.getElementById("hint")
.classList.remove("hidden");

updateStats();

}


/* ==================================================
   STATYSTYKI
================================================== */

function updateStats() {

document.getElementById("lives").innerText = lives;
document.getElementById("coins").innerText = coins;
document.getElementById("combo").innerText = combo;
document.getElementById("score").innerText = score;

}


/* ==================================================
   KONIEC
================================================== */

function endGame() {

clearInterval(timer);

document.getElementById("game")
.classList.add("hidden");

document.getElementById("end")
.classList.remove("hidden");

document.getElementById("finalScore")
.innerText = score;

document.getElementById("finalCoins")
.innerText = coins;

let record =
Number(localStorage.getItem("footballRecord") || 0);

if(score > record) {

record = score;

localStorage.setItem(
"footballRecord",
record
);

}

document.getElementById("finalRecord")
.innerText = record;

}


/* ==================================================
   MENU
================================================== */

function backToMenu() {

clearInterval(timer);

document.getElementById("difficulty")
.classList.add("hidden");

document.getElementById("game")
.classList.add("hidden");

document.getElementById("end")
.classList.add("hidden");

document.getElementById("menu")
.classList.remove("hidden");

loadRecord();

}


/* ==================================================
   REKORD
================================================== */

function loadRecord() {

document.getElementById("record")
.innerText =
localStorage.getItem("footballRecord") || 0;

}

loadRecord();

</script>

</body>
</html>
